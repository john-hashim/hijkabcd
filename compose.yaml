services:
  workspace:
    build: .
    init: true
    working_dir: /workspace/frontend
    volumes:
      - .:/workspace
    ports:
      - "127.0.0.1:5173:5173"
    command: npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: app_db
    volumes:
      - postgres_data:/var/lib/postgresql
volumes:
  postgres_data:
